<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractals 🎵 — Logged out</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #b3b3b3;
            margin-top: 0.4rem;
            font-size: 0.95rem;
        }

        .logged-out-view {
            text-align: center;
            padding-top: 3rem;
        }

        .logged-out-message {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        .btn-spotify {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            background: #1DB954;
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            transition: background 0.15s;
        }

        .btn-spotify:hover { background: #1ed760; }

        .account-note {
            margin-top: 2rem;
            padding: 1rem 1.25rem;
            background: #282828;
            border-radius: 8px;
            font-size: 0.875rem;
            color: #b3b3b3;
            line-height: 1.5;
        }

        .account-note a {
            color: #1DB954;
            text-decoration: none;
        }

        .account-note a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Fractals 🎵</h1>
            <p class="subtitle">Discover music that means something to you</p>
        </header>

        <div class="logged-out-view">
            <p class="logged-out-message">You've been logged out.</p>

            <a href="/oauth2/authorization/spotify" class="btn-spotify">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                </svg>
                Sign in with Spotify
            </a>

            <div class="account-note">
                To sign in with a different account, log out of Spotify first at
                <a href="https://open.spotify.com" target="_blank" rel="noopener">open.spotify.com</a>,
                then return here to sign in.
            </div>
        </div>
    </div>
</body>
</html>
