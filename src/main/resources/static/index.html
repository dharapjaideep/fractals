<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractals 🎵</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #b3b3b3;
            margin-top: 0.4rem;
            font-size: 0.95rem;
        }

        /* ── Login ─────────────────────────────────────────── */
        #login-view {
            text-align: center;
            padding-top: 3rem;
        }

        .btn-spotify {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            background: #1DB954;
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            transition: background 0.15s;
        }

        .btn-spotify:hover { background: #1ed760; }

        /* ── Main interface ────────────────────────────────── */
        #main-view { display: none; }

        .user-greeting {
            color: #b3b3b3;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: right;
        }

        .user-greeting strong { color: #fff; }

        .logout-link {
            color: #b3b3b3;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .logout-link:hover { color: #fff; }

        .input-area {
            background: #282828;
            border-radius: 12px;
            padding: 1.25rem;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 130px;
            line-height: 1.6;
        }

        textarea::placeholder { color: #888888; opacity: 1; }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.75rem;
        }

        .char-count {
            font-size: 0.8rem;
            color: #5a5a5a;
        }

        .char-count.near-limit { color: #e67e22; }

        .btn-send {
            background: #1DB954;
            color: #000;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-send:hover:not(:disabled) { background: #1ed760; }
        .btn-send:disabled { opacity: 0.45; cursor: not-allowed; }

        .hint {
            font-size: 0.75rem;
            color: #5a5a5a;
            margin-top: 0.6rem;
        }

        /* ── Alpha badge ──────────────────────────────────── */
        .alpha-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            background: #2a2a2a;
            color: #1DB954;
            border: 1px solid #1DB954;
            vertical-align: middle;
            margin-left: 10px;
            cursor: default;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ── Loading ──────────────────────────────────────── */
        #loading {
            display: none;
            text-align: center;
            padding: 2.5rem 0;
            color: #b3b3b3;
            font-size: 0.9rem;
        }

        .spinner {
            display: block;
            width: 28px;
            height: 28px;
            border: 2.5px solid #333;
            border-top-color: #1DB954;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 0 auto 0.75rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Results ──────────────────────────────────────── */
        #results { margin-top: 2rem; display: none; }

        .chat-message {
            background: #282828;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            line-height: 1.65;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            border-left: 3px solid #1DB954;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #b3b3b3;
            margin-bottom: 0.75rem;
        }

        .track-list { display: flex; flex-direction: column; gap: 0.4rem; }

        .track-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #282828;
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
        }

        .track-item:hover { background: #333; }

        .track-thumb {
            width: 46px;
            height: 46px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            background: #333;
        }

        .track-thumb-placeholder {
            width: 46px;
            height: 46px;
            border-radius: 4px;
            background: #333;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .track-info { flex: 1; min-width: 0; }

        .track-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #b3b3b3;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 0.15rem;
        }

        .track-play {
            color: #1DB954;
            font-size: 0.85rem;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .track-item:hover .track-play { opacity: 1; }

        /* ── Playlist saved notice ─────────────────────────── */
        .playlist-saved {
            margin-bottom: 1.25rem;
            padding: 1rem 1.25rem;
            background: #1e3d2a;
            border: 2px solid #1DB954;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .playlist-saved-text {
            font-size: 1rem;
            color: #b3b3b3;
            line-height: 1.4;
        }

        .playlist-saved-text strong { color: #1DB954; }

        .btn-open-spotify {
            background: #1DB954;
            color: #000;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.45rem 1.1rem;
            border-radius: 50px;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .btn-open-spotify:hover { background: #1ed760; }

        /* ── Error ────────────────────────────────────────── */
        .error-msg {
            background: #2d1414;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .playlist-saved { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Fractals 🎵<span class="alpha-badge" title="Early alpha, invite-only — core recommendation engine works but expect rough edges. Your feedback helps shape what this becomes.">Alpha · Invite Only</span></h1>
            <p class="subtitle">Discover music that means something to you</p>
        </header>

        <!-- Login state -->
        <div id="login-view">
            <a href="/oauth2/authorization/spotify" class="btn-spotify">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                </svg>
                Login with Spotify
            </a>
        </div>

        <!-- Main interface -->
        <div id="main-view">
            <div class="user-greeting">Signed in as <strong id="display-name"></strong> · <a href="#" class="logout-link" onclick="logout(); return false;">Logout</a></div>

            <div class="input-area">
                <textarea
                    id="message-input"
                    maxlength="500"
                ></textarea>
                <div class="input-footer">
                    <span class="char-count" id="char-count">0 / 500</span>
                    <button class="btn-send" id="send-btn" onclick="sendMessage()">Find Music</button>
                </div>
            </div>
            <p class="hint">Tip: Ctrl+Enter to send</p>

            <div id="loading">
                <div class="spinner"></div>
                <span id="loading-text">Understanding what moves you...</span>
            </div>

            <div id="results"></div>
        </div>
    </div>

    <script>
        function getCsrfToken() {
            const match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : null;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Auth check on load
        async function init() {
            try {
                // redirect:'manual' is kept as a safety net; with HttpStatusEntryPoint
                // configured for /api/**, Spring now returns 401 (not a redirect) when
                // the session is absent, so opaqueredirect is no longer the primary path.
                const res = await fetch('/api/auth/me', { redirect: 'manual' });
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('display-name').textContent =
                        user.displayName || user.spotifyId;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('main-view').style.display = 'block';
                    // Build the multi-line placeholder from the three personalized example lines
                    // plus a static fourth line (same for all users, no personalization needed).
                    const buildPlaceholder = (moodExample, playlistExample, feelingLine) =>
                        'You can ask:\n'
                        + '- Based on mood: "' + moodExample + '"\n'
                        + '- Based on a playlist: "' + playlistExample + '"\n'
                        + '- Based on a feeling: ' + feelingLine + '\n'
                        + '- Feeling curious: "What music genres should I explore based on my taste?"';

                    const msgInput = document.getElementById('message-input');
                    // Render immediately with generic examples — swapped for personalized
                    // text once the fetch below resolves with ready:true. The feeling line
                    // shows an in-progress message, same role the single dynamic line had before.
                    msgInput.placeholder = buildPlaceholder(
                        'something chill', 'something like my Jazz playlist',
                        'Analyzing your playlists...');

                    // Retry up to 3 times; replace all three lines once personalized text arrives.
                    (async () => {
                        for (let i = 0; i < 3; i++) {
                            try {
                                const res = await fetch('/api/chat/placeholder');
                                if (res.ok) {
                                    const data = await res.json();
                                    if (data.ready && data.moodExample && data.playlistExample && data.feelingLine) {
                                        msgInput.placeholder = buildPlaceholder(
                                            data.moodExample, data.playlistExample, data.feelingLine);
                                        return;
                                    }
                                }
                            } catch (_) {}
                            if (i < 2) await new Promise(r => setTimeout(r, 1500));
                        }
                        // All retries: not ready yet — leave the generic examples in place
                    })();
                } else if (res.type === 'opaqueredirect') {
                    // Fallback: redirect to OAuth if for any reason a redirect escapes the
                    // entry-point config (e.g. a path not covered by /api/**).
                    window.location.href = '/oauth2/authorization/spotify';
                    return;
                } else {
                    showLogin();
                }
            } catch {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('main-view').style.display = 'none';
        }

        // Character counter
        document.getElementById('message-input').addEventListener('input', function () {
            const len = this.value.length;
            const counter = document.getElementById('char-count');
            counter.textContent = len + ' / 500';
            counter.classList.toggle('near-limit', len > 450);
        });

        // Ctrl/Cmd+Enter to send
        document.getElementById('message-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendMessage();
        });

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            const sendBtn = document.getElementById('send-btn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            sendBtn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            results.innerHTML = '';

            // Rotating loading-stage copy — gives a sense of progress on slower requests.
            // Cleared in finally below, so a fast response simply never shows later stages.
            const loadingStages = [
                'Understanding what moves you...',
                'Finding the emotional thread...',
                'Exploring connections...',
                'Discovering music worth exploring...',
                'Curating your playlist...'
            ];
            const loadingText = document.getElementById('loading-text');
            loadingText.textContent = loadingStages[0];
            const loadingStageTimers = [
                setTimeout(() => { loadingText.textContent = loadingStages[1]; }, 3000),
                setTimeout(() => { loadingText.textContent = loadingStages[2]; }, 6000),
                setTimeout(() => { loadingText.textContent = loadingStages[3]; }, 9000),
                setTimeout(() => { loadingText.textContent = loadingStages[4]; }, 12000)
            ];

            try {
                const csrfToken = getCsrfToken();

                const postOptions = (token) => ({
                    method: 'POST',
                    redirect: 'manual',  // detect session-expiry redirects instead of following cross-origin
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'X-XSRF-TOKEN': token } : {})
                    },
                    body: JSON.stringify({ message })
                });

                let res = await fetch('/api/chat', postOptions(csrfToken));

                if (res.type === 'opaqueredirect') {
                    // Session expired mid-session — same handling as init()
                    window.location.href = '/oauth2/authorization/spotify';
                    return;
                }

                if (res.status === 401) {
                    showLogin();
                    return;
                }

                if (res.status === 403) {
                    // CSRF token may be stale — refresh cookie and retry once
                    await fetch('/api/auth/me');
                    const freshToken = getCsrfToken();
                    res = await fetch('/api/chat', postOptions(freshToken));
                    if (res.type === 'opaqueredirect' || res.status === 401 || res.status === 403) {
                        window.location.href = '/oauth2/authorization/spotify';
                        return;
                    }
                }

                if (!res.ok) {
                    const body = await res.text();
                    throw new Error('Server error (' + res.status + '): ' + body);
                }

                const data = await res.json();
                renderResults(data);
            } catch (err) {
                results.innerHTML =
                    '<div class="error-msg">Something went wrong: ' +
                    escapeHtml(err.message) +
                    '. Please try again.</div>';
                results.style.display = 'block';
            } finally {
                loadingStageTimers.forEach(clearTimeout);
                sendBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function renderResults(data) {
            const results = document.getElementById('results');
            let html = '';

            if (data.message) {
                html += '<div class="chat-message">' + escapeHtml(data.message) + '</div>';
            }

            if (data.playlistName) {
                html +=
                    '<div class="playlist-saved">' +
                        '<span class="playlist-saved-text">Saved to your <strong>' +
                            escapeHtml(data.playlistName) +
                        '</strong> playlist ✓</span>' +
                        (data.playlistId
                            ? '<a class="btn-open-spotify" href="https://open.spotify.com/playlist/' + escapeHtml(data.playlistId) + '" target="_blank" rel="noopener">Open Spotify Playlist</a>'
                            : '<a class="btn-open-spotify" href="https://open.spotify.com" target="_blank" rel="noopener">Open Spotify Playlist</a>') +
                    '</div>';
            }

            if (data.tracks && data.tracks.length > 0) {
                html += '<div class="section-label">Recommended tracks</div>';
                html += '<div class="track-list">';
                for (const item of data.tracks) {
                    const track = item.track;
                    const artists = (track.artists || []).map(a => a.name).join(', ');
                    // Spotify returns images largest-first; last is smallest (64×64 thumbnail)
                    const images = track.album?.images || [];
                    const thumb = images.length ? images[images.length - 1].url : null;
                    const spotifyUrl = track.id
                        ? 'https://open.spotify.com/track/' + track.id
                        : null;

                    const imgTag = thumb
                        ? '<img class="track-thumb" src="' + escapeHtml(thumb) + '" alt="" loading="lazy">'
                        : '<div class="track-thumb-placeholder">♪</div>';

                    const linkOpen  = spotifyUrl ? '<a class="track-item" href="' + escapeHtml(spotifyUrl) + '" target="_blank" rel="noopener">' : '<div class="track-item">';
                    const linkClose = spotifyUrl ? '</a>' : '</div>';
                    const playIcon  = spotifyUrl ? '<span class="track-play">▶ Spotify</span>' : '';

                    html += linkOpen +
                        imgTag +
                        '<div class="track-info">' +
                            '<div class="track-name">' + escapeHtml(track.name) + '</div>' +
                            '<div class="track-artist">' + escapeHtml(artists) + '</div>' +
                        '</div>' +
                        playIcon +
                        linkClose;
                }
                html += '</div>';
            }

            results.innerHTML = html;
            results.style.display = 'block';
            results.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function logout() {
            const token = getCsrfToken();
            try {
                await fetch('/logout', {
                    method: 'POST',
                    headers: { 'X-XSRF-TOKEN': token }
                });
            } catch (e) {
                // ignore — redirect to the confirmation page regardless of fetch outcome
            }
            window.location.href = '/logged-out.html';
        }

        init();
    </script>
</body>
</html>
